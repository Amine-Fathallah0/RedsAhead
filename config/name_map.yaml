# Canonical club name -> aliases seen from FBref and/or Understat.
# Accents and case never need an alias entry (normalise() handles those), and
# neither does FBref's leftover country-flag-code prefix on European opponents
# (e.g. "es Atlético Madrid" -> normalise() strips the "es " automatically).
# An opponent name that isn't found here is reported by the build, not
# silently dropped or guessed at; add it here and rerun.
